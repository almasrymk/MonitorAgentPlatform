name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throw-away password of the CI-only SQL Server service container.
          MSSQL_SA_PASSWORD: CI-ONLY-Sql-Pa55word!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      MONITOR_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=CI-ONLY-Sql-Pa55word!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore MonitorCloud.slnx
      - name: Vulnerable packages (High/Critical fail)
        shell: pwsh
        run: ./build/vulnerable-packages.ps1
      - name: Build (warnings as errors)
        run: dotnet build MonitorCloud.slnx -c Release -warnaserror --no-restore
      - name: Unit and architecture tests
        run: >-
          dotnet test MonitorCloud.slnx -c Release --no-build
          --filter "FullyQualifiedName~MonitorCloud.UnitTests|FullyQualifiedName~MonitorCloud.ArchitectureTests"
          --settings coverlet.runsettings --collect "XPlat Code Coverage" --results-directory TestResults/unit
      - name: Integration, gateway and contract (fake) tests
        run: >-
          dotnet test MonitorCloud.slnx -c Release --no-build
          --filter "FullyQualifiedName~MonitorCloud.IntegrationTests|FullyQualifiedName~MonitorCloud.GatewayTests|FullyQualifiedName~MonitorCloud.ContractTests"
          --settings coverlet.runsettings --collect "XPlat Code Coverage" --results-directory TestResults/integration
      - name: Coverage gates
        shell: pwsh
        run: |
          dotnet reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:TestResults/coverage -reporttypes:"Cobertura;MarkdownSummaryGithub"
          Get-Content TestResults/coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY
          ./build/coverage-gate.ps1 -Report TestResults/coverage/Cobertura.xml
      - name: Pending migration check
        run: dotnet ef migrations has-pending-model-changes -p src/MonitorCloud.Infrastructure -s src/MonitorCloud.Api --no-build --configuration Release
        env:
          ConnectionStrings__Monitor: ${{ env.MONITOR_TEST_SQLSERVER }}
          Jwt__SigningKey: CI-ONLY-user-signing-key-0123456789abcdef
          Jwt__DeviceSigningKey: CI-ONLY-device-signing-key-0123456789abcdef
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/
          retention-days: 7

  portal:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + logical CSS properties)
        run: npm run lint
      - name: Unit tests with coverage gate
        run: npm run test:coverage
      - name: Production build with budgets
        run: npx ng build --configuration production
      - name: Gzip bundle budgets
        run: npm run build:check

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # Throw-away password of the CI-only SQL Server service container.
          MSSQL_SA_PASSWORD: CI-ONLY-Sql-Pa55word!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Monitor: Server=localhost,1433;Database=MonitorCloud;User Id=sa;Password=CI-ONLY-Sql-Pa55word!;TrustServerCertificate=True
      E2E_API_RUNNING: "1"
      # Every e2e test signs in; the per-IP login limit (20/min) would refuse them.
      RateLimiting__Auth__PermitLimit: "1000"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Start the API with the demo seed
        run: |
          dotnet build src/MonitorCloud.Api -c Release
          nohup dotnet run --project src/MonitorCloud.Api --launch-profile http --no-build -c Release > api.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://localhost:5300/health/ready && break; sleep 2; done
          curl -fs http://localhost:5300/health/ready
      - run: npm ci
        working-directory: portal
      - name: API types are up to date (api:types freshness)
        working-directory: portal
        run: |
          npm run api:types
          git diff --exit-code -- src/app/core/api/schema.d.ts
      - run: npx playwright install --with-deps chromium
        working-directory: portal
      - name: Playwright
        working-directory: portal
        run: npx playwright test
      # MC-701: the real agent's connector test runs against this cloud (after Playwright: it enrolls a device).
      - uses: actions/checkout@v5
        with:
          repository: almasrymk/UBGMonitor
          ref: ${{ vars.AGENT_REF || 'master' }}
          path: agent
      - name: Agent compatibility (MC-701)
        run: |
          if [ ! -d agent/src/MonitorAgent.Cloud ]; then echo "This agent ref has no MonitorAgent.Cloud yet; skipped."; exit 0; fi
          export MONITORCLOUD_E2E_URL=http://localhost:5300
          export MONITORCLOUD_E2E_GATEWAY=http://localhost:5301
          export MONITORCLOUD_E2E_PRODUCTKEY="$(jq -r '.licenses[] | select(.licenseNumber=="LIC-ACME-0001") | .productKey' seed/licensing-fake.json)"
          dotnet test agent/tests/MonitorAgent.Tests -c Release --filter "FullyQualifiedName~CloudEndToEnd" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            portal/playwright-report/
            portal/test-results/
            api.log
          retention-days: 7
  secrets-scan:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  # Live contract against a Licensing Platform with LP-1..LP-5 (nightly and on demand). Configure the repository
  # variable LICENSING_CONTRACT_URL and the secrets LICENSING_CONTRACT_CLIENT_ID / _CLIENT_SECRET / _PRODUCT_KEY /
  # _CUSTOMER_ID (and optionally _LIMITED_KEY, _SUSPENDED_KEY) from tools/MonitorCloud.LicensingSeeder.
  licensing-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LICENSING_CONTRACT_URL: ${{ vars.LICENSING_CONTRACT_URL }}
      LICENSING_CONTRACT_CLIENT_ID: ${{ secrets.LICENSING_CONTRACT_CLIENT_ID }}
      LICENSING_CONTRACT_CLIENT_SECRET: ${{ secrets.LICENSING_CONTRACT_CLIENT_SECRET }}
      LICENSING_CONTRACT_PRODUCT_KEY: ${{ secrets.LICENSING_CONTRACT_PRODUCT_KEY }}
      LICENSING_CONTRACT_CUSTOMER_ID: ${{ secrets.LICENSING_CONTRACT_CUSTOMER_ID }}
      LICENSING_CONTRACT_LIMITED_KEY: ${{ secrets.LICENSING_CONTRACT_LIMITED_KEY }}
      LICENSING_CONTRACT_SUSPENDED_KEY: ${{ secrets.LICENSING_CONTRACT_SUSPENDED_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/MonitorCloud.ContractTests -c Release